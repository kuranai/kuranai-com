name: Sync and deploy Dovari

on:
  workflow_dispatch:
  schedule:
    - cron: '17 04 * * *'

permissions:
  contents: write

concurrency:
  group: dovari-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Synchronize Dovari upstream
        id: sync
        run: |
          before="$(git rev-parse HEAD)"
          npm run sync:dovari
          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install synchronized dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run quality gates
        if: steps.sync.outputs.changed == 'true'
        run: npm run ci

      - name: Deploy synchronized application
        if: steps.sync.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN' >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing GitHub secret CLOUDFLARE_ACCOUNT_ID' >&2; exit 1)
          npm run deploy

      - name: Publish synchronized source
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main
